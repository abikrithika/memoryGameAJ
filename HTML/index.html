   <h1>Flip & Match | Memory Game</h1>

  <div id="gameModal" class="modal">

    <h2 id="endMessage">🌌 Mission Complete!</h2>
    <p>🚀 Reveals: <span id="finalReveals"></span></p>
    <p>🛰 Attempts: <span id="finalAttempts"></span></p>
    <button id="restartBtn">Play Again</button>
  </div>
</div>


<p id="gameOver" style="display:none; font-size:1.5rem; margin-top:20px;">
  🎉 End of Game!
</p>


  <div class="card-grid">
